<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23050505'/><circle cx='50' cy='50' r='18' fill='%2300FFA3'/><circle cx='50' cy='50' r='30' fill='none' stroke='%2300FFA3' stroke-width='4' stroke-dasharray='4 4'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D1G1TAL ASSET FACTORY // [v2.4] Infrastructure</title>
    <meta name="description" content="Autonomous agent engines, headless micro-SaaS endpoints, and programmatic data syndication pipelines built for zero-friction scale." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#050505] text-white selection:bg-[#00FFA3] selection:text-black font-sans antialiased overflow-x-hidden">
    <div id="root"></div>
    <!-- Global DAFW Share Pill -->
    <div id="dafw-share-widget" style="position:fixed;bottom:20px;right:20px;z-index:99999;display:flex;align-items:center;">
      <button onclick="shareDAFW()" style="display:inline-flex;align-items:center;gap:8px;padding:8px 16px;background:rgba(5,5,5,0.85);backdrop-filter:blur(12px);border:1px solid rgba(0,255,163,0.4);color:#00FFA3;border-radius:9999px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:0.05em;cursor:pointer;box-shadow:0 0 15px rgba(0,255,163,0.15);transition:all 0.2s ease;">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
        <span>SHARE [DAFW]</span>
      </button>
    </div>
    <div id="dafw-share-toast" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#050505;color:#00FFA3;border:1px solid #00FFA3;padding:10px 20px;border-radius:9999px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;letter-spacing:0.05em;box-shadow:0 0 25px rgba(0,255,163,0.3);display:none;z-index:100000;align-items:center;gap:8px;">
      <span>⚡ Link copied to clipboard!</span>
    </div>
    <script>
      function shareDAFW(){
        var t = 'D1G1TAL ASSET FACTORY // [v2.4] Infrastructure';
        var u = window.location.href;
        var d = 'Autonomous agent engines, headless micro-SaaS endpoints, and programmatic data syndication pipelines.';
        if (navigator.share) {
          navigator.share({ title: t, text: d, url: u }).catch(function(e) {
            if (e.name !== 'AbortError') copyDAFWUrl(u);
          });
        } else {
          copyDAFWUrl(u);
        }
      }
      function copyDAFWUrl(u){
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(u).then(showDAFWToast).catch(function(){ fallbackDAFWCopy(u); });
        } else {
          fallbackDAFWCopy(u);
        }
      }
      function fallbackDAFWCopy(u){
        var i = document.createElement('input');
        i.value = u;
        document.body.appendChild(i);
        i.select();
        try { document.execCommand('copy'); showDAFWToast(); } catch(e){}
        document.body.removeChild(i);
      }
      function showDAFWToast(){
        var el = document.getElementById('dafw-share-toast');
        if(!el) return;
        el.style.display = 'inline-flex';
        setTimeout(function(){ el.style.display = 'none'; }, 3000);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
